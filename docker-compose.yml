services:
  mysql:
    image: mysql:8.4
    container_name: rateshield-mysql
    environment:
      MYSQL_DATABASE: rateshield
      MYSQL_USER: rateshield
      MYSQL_PASSWORD: rateshield
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: rateshield-api
    environment:
      DATABASE_URL: mysql+pymysql://rateshield:rateshield@mysql:3306/rateshield
      SECRET_KEY: local-docker-secret
      LOG_LEVEL: INFO
      DEFAULT_RATE_LIMIT_ALGORITHM: token_bucket
      DEFAULT_MAX_REQUESTS: 100
      DEFAULT_TIME_WINDOW: 60
      DEFAULT_REFILL_RATE: 10
      DEFAULT_BUCKET_CAPACITY: 100
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
